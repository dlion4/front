[project]
name = "Front"
version = "0.1.0"
description = "A software and project management system"
# List of authors with extended information
authors = [
  { name = "Jeckonia Onyango", email = "aurinkowebner@front.com"}
]
license = { file = "LICENSE" }
dependencies = [
    "python-slugify==8.0.4",
    "Pillow==10.4.0",
    "argon2-cffi==23.1.0",
    "whitenoise==6.7.0",
    "redis==5.0.7",
    "hiredis==3.0.0",
    "celery==5.4.0",
    "django-celery-beat==2.7.0",
    "flower==2.0.1",
    "uvicorn[standard]==0.30.3",
    "uvicorn-worker==0.2.0",
    "django>=5.1,<5.2",
    "django-environ==0.11.2",
    "django-model-utils==4.5.1",
    "django-allauth[mfa]==0.63.6",
    "django-crispy-forms==2.3",
    "crispy-bootstrap5==2024.2",
    "django-redis==5.4.0",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.4.0",
    "drf-spectacular==0.27.2",
    "django-webpack-loader==3.1.0",
    "Werkzeug[watchdog]==3.0.3",
    "ipdb==0.13.13",
    "psycopg[c]==3.2.6",
    "watchfiles==0.21.0",
    # Production Deps
    "mypy==1.10.0",
    "django-stubs[compatible-mypy]==5.0.2",
    "pytest==8.3.1",
    "pytest-sugar==1.0.0",
    "djangorestframework-stubs[compatible-mypy]==3.15.0",
    "sphinx==7.4.7",
    "sphinx-autobuild==2024.4.16",
    "ruff==0.5.4",
    "coverage==7.6.0",
    "djlint==1.34.1",
    "pre-commit==3.7.1",
    "factory-boy==3.3.0",
    "django-debug-toolbar==4.4.6",
    "django-extensions==3.2.3",
    "django-coverage-plugin==3.1.0",
    "pytest-django==4.8.0",
    "gunicorn==22.0.0",
    "psycopg[c]==3.2.6",
    "sentry-sdk==2.10.0",
    "django-storages[s3]==1.14.4",
    "django-anymail[amazon-ses]==11.0.1",
    "colorlog>=6.9.0",
]


# === Build system ===
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["front/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*.py",
    "staticfiles/*"
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  "ISC",
  "ICN",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  "PERF",
  "RUF"
]
ignore = [
  "S101",
  "RUF012",
  "SIM102",
  "UP038"
]
fixable = ["ALL"]
unfixable = []
extend-unsafe-fixes = [
    "UP038"
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
force-single-line = true
