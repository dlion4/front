{% load static %}

<div class="dropdown">
  <a class="navbar-dropdown-account-wrapper" href="javascript:;" id="accountNavbarDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside" data-bs-dropdown-animation="data-bs-dropdown-animation">
    <div class="avatar avatar-sm avatar-circle">
      <img class="avatar-img" src="{% static 'assets/img/160x160/img9.jpg' %}" alt="Image Description"/>
      <span class="avatar-status avatar-sm-status avatar-status-success"></span>
    </div>
  </a>

  <div class="dropdown-menu dropdown-menu-end navbar-dropdown-menu navbar-dropdown-menu-borderless navbar-dropdown-account" aria-labelledby="accountNavbarDropdown" style="width: 16rem">
    <div class="dropdown-item-text">
      <div class="d-flex align-items-center">
        <div class="avatar avatar-sm avatar-circle">
          <img class="avatar-img" src="{% static 'assets/img/160x160/img9.jpg' %}" alt="Image Description"/>
        </div>
        <div class="flex-grow-1 ms-3">
          <h5 class="mb-0">{{profile.full_name|truncatechars:"16"}}</h5>
          <p class="card-text text-body">{{profile.user.site_email|truncatechars:"18"}}</p>
        </div>
      </div>
    </div>

    <div class="dropdown-divider"></div>

    <!-- Dropdown -->
    <div class="dropdown">
      <a class="navbar-dropdown-submenu-item dropdown-item dropdown-toggle" href="javascript:;" id="navSubmenuPagesAccountDropdown1" data-bs-toggle="dropdown" aria-expanded="false">Set status</a>

      <div class="dropdown-menu dropdown-menu-end navbar-dropdown-menu navbar-dropdown-menu-borderless navbar-dropdown-sub-menu" aria-labelledby="navSubmenuPagesAccountDropdown1">
        <a class="dropdown-item" href="#">
          <span class="legend-indicator bg-success me-1"></span>
          Available
        </a>
        <a class="dropdown-item" href="#">
          <span class="legend-indicator bg-danger me-1"></span>
          Busy
        </a>
        <a class="dropdown-item" href="#">
          <span class="legend-indicator bg-warning me-1"></span>
          Away
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="#">
          Reset status
        </a>
      </div>
    </div>
    <!-- End Dropdown -->

    <a class="dropdown-item" href="{% url 'profile:home' %}">Profile</a>
    <a class="dropdown-item" href="#">Settings</a>

    <div class="dropdown-divider"></div>

    <a class="dropdown-item" href="#">
      <div class="d-flex align-items-center">
        <div class="flex-shrink-0">
          <div class="avatar avatar-sm avatar-dark avatar-circle">
            <span class="avatar-initials">HS</span>
          </div>
        </div>
        <div class="flex-grow-1 ms-2">
          <h5 class="mb-0">
            Htmlstream
            <span class="badge bg-primary rounded-pill text-uppercase ms-1">PRO</span>
          </h5>
          <span class="card-text">hs.example.com</span>
        </div>
      </div>
    </a>

    <div class="dropdown-divider"></div>

    <!-- Dropdown -->
    <div class="dropdown">
      <a class="navbar-dropdown-submenu-item dropdown-item dropdown-toggle" href="javascript:;" id="navSubmenuPagesAccountDropdown2" data-bs-toggle="dropdown" aria-expanded="false">Customization</a>

      <div class="dropdown-menu dropdown-menu-end navbar-dropdown-menu navbar-dropdown-menu-borderless navbar-dropdown-sub-menu" aria-labelledby="navSubmenuPagesAccountDropdown2">
        <a class="dropdown-item" href="#">
          Invite people
        </a>
        <a class="dropdown-item" href="#">
          Analytics
          <i class="bi-box-arrow-in-up-right"></i>
        </a>
        <a class="dropdown-item" href="#">
          Customize Front
          <i class="bi-box-arrow-in-up-right"></i>
        </a>
      </div>
    </div>
    <!-- End Dropdown -->

    <a class="dropdown-item" href="#">Manage team</a>

    <div class="dropdown-divider"></div>

    <a class="dropdown-item logoutBtn" href="#" role="button" url="{% url 'users:logout' %}">Sign out</a>
  </div>
</div>

<script>
  $(document).ready(function () {
    $(".logoutBtn").each(function () {
      $(this).click(function (event) {
        event.preventDefault();
        $.ajax({
          url: $(this).attr("url"),
          type: "POST",
          success: function (response) {
            if (response.success) {
              window.location.href = response.url;
            } else {
              alert(response.message);
            }
          }
        });
        return false;
      });
    });
  });
</script>
