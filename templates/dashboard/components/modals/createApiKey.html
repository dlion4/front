{% load static %}

<div
  class="modal fade"
  id="createAKIKeyModal"
  tabindex="-1"
  aria-labelledby="createAKIKeyModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <!-- Header -->
      <div class="modal-header">
        <h4 class="modal-title" id="createAKIKeyModalLabel">Create API Key</h4>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <!-- End Header -->

      <!-- Body -->
      <div class="modal-body">
        <!-- Form -->
        <form>
          <!-- .Name -->
          <div class="form-group">
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="API Key name (optional)"
              />
            </div>
          </div>
          <!-- .Project -->
          <div class="form-group">
            <div class="mb-3">
              <div class="tom-select-custom">
                <select
                  class="js-select form-select"
                  autocomplete="off"
                  data-hs-tom-select-options='{
            "placeholder": "Select a Project"
          }'
                >
                  <option value="">Select a project...</option>
                  <option value="4">SyncPay</option>
                </select>
              </div>
            </div>
          </div>
          <!-- .privacy -->
          <div class="form-group">
            <div class="mb-0">
              <div class="tom-select-custom">
                <select class="js-select form-select">
                  <option
                    value="public"
                    data-option-template='<div class="d-flex align-items-start"><div class="flex-shrink-0"><i class="bi-globe"></i></div><div class="flex-grow-1 ms-2"><span class="d-block fw-semibold">Public</span><span class="tom-select-custom-hide small">Use this to access projects files etc just on the client.</span></div></div>'
                  >
                    Public
                  </option>
                  <option
                    value="private"
                    data-option-template='<div class="d-flex align-items-start"><div class="flex-shrink-0"><i class="bi-lock"></i></div><div class="flex-grow-1 ms-2"><span class="d-block fw-semibold">Private</span><span class="tom-select-custom-hide small">Use this api to authorize request from clients on the server.</span></div></div>'
                  >
                    Private
                  </option>
                </select>
              </div>
            </div>
          </div>
        </form>
      </div>
      <!-- End Body -->

      <!-- Footer -->
      <div class="modal-footer">
        <div class="row align-items-sm-center flex-grow-1 mx-n2">
          <div class="col-sm mb-2 mb-sm-0">
            <p class="modal-footer-text">
              What is an API?
              <i
                class="bi-question-circle"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                aria-label="API stands for application programming interface. It can be helpful to think of the API as a way for different apps to talk to one another."
                data-bs-original-title="API stands for application programming interface. It can be helpful to think of the API as a way for different apps to talk to one another."
              ></i>
            </p>
          </div>
          <!-- End Col -->

          <div class="col-sm-auto">
            <button class="btn btn-primary" style="width: 130px" type="button">
              <div class="d-flex align-items-center">
                <span class="btn-text">Generate</span>
                <!-- <div
                    class="spinner-border spinner-border-sm ms-auto spinner d-none"
                    role="status"
                    aria-hidden="true"
                  ></div> -->
              </div>
            </button>
          </div>
        </div>
        <!-- End Col -->
      </div>
      <!-- End Row -->
    </div>
    <!-- End Footer -->
  </div>
</div>
